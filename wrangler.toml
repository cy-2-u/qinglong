name = "qinglong"
main = "src/index.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[triggers]
crons = ["0 * * * *"]

[vars]
TZ_OFFSET = "8"

[[d1_databases]]
binding = "DB"
database_name = "qinglong"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "TaskScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskScheduler"]
