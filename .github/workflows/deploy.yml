name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check
      - run: npx wrangler deploy --dry-run
      - name: Resolve or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -er '[.result[] | select(.name=="qinglong") | .uuid] | if length==0 then "" elif length==1 then .[0] else error("Duplicate database name") end')
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API" -d '{"name":"qinglong"}' | jq -er '.result.uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.toml
      - run: npx wrangler deploy
      - name: Sync optional panel password
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: |
          if [ -n "$PANEL_PASSWORD" ]; then
            printf '%s' "$PANEL_PASSWORD" | npx wrangler secret put PANEL_PASSWORD
          fi
