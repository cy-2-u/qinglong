name: Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必配 Secrets:
      #   CLOUDFLARE_API_TOKEN  —— 模板 "Edit Cloudflare Workers"，附加 D1 编辑权限
      #   CLOUDFLARE_ACCOUNT_ID
      # 可选 Secret:
      #   PANEL_PASSWORD        —— 配置后每次部署自动同步为面板密码；
      #                            不配则继续用 wrangler secret put 设置过的密码
      #
      # D1 无需手动创建：下面一步自动"查找或创建"名为 qinglong 的库并回填 ID。

      - name: Resolve or create D1 database
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -sf -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.name=="qinglong") | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            echo "D1 database 'qinglong' not found, creating..."
            DB_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "$API" -d '{"name":"qinglong"}' | jq -er '.result.uuid')
          fi
          echo "Using D1 database: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 'latest'

      - name: Sync panel password (when PANEL_PASSWORD secret exists)
        run: |
          if [ -n "$PANEL_PASSWORD" ]; then
            printf '%s' "$PANEL_PASSWORD" | npx wrangler secret put PANEL_PASSWORD
          else
            echo "GitHub secret PANEL_PASSWORD not set; keep the password configured via 'wrangler secret put'."
          fi
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
